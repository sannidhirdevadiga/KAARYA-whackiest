.top{display:flex;gap:12px;align-items:center;margin-bottom:18px;position:relative}
.menu{display:none}.search{flex:1;max-width:560px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;color:var(--mu);text-align:left;display:flex;gap:8px;align-items:center}
.ico{background:var(--card);border:1px solid var(--ln);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--tx);position:relative}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;background:var(--or);border-radius:50%;animation:pulse 1.6s infinite}
.av{width:38px;height:38px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px;box-shadow:var(--sh);transition:.25s}

h2.sec{font-size:22px;margin:22px 0 12px}.big{font:700 30px 'Baloo 2'}
input,select,textarea{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
input[type=range]{width:100%;accent-color:#F28A36;padding:0}
.bar{height:9px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;animation:grow 1s ease-out both;transform-origin:left}
.ov{position:fixed;inset:0;background:rgba(20,33,61,.5);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .2s}
.modal{background:var(--card);border-radius:22px;padding:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;animation:pop .25s}
.notice{background:rgba(242,138,54,.14);border-left:4px solid var(--or);padding:10px 14px;border-radius:10px;font-size:13px}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;animation:float .4s;max-width:320px}
.drop{position:absolute;right:50px;top:50px;width:320px;z-index:40;animation:pop .2s}

.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--or);border-radius:50%;animation:rot 0.8s linear infinite;display:inline-block}
.page{animation:fade .35s}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--ln)}
.rot{animation:rot 6s linear infinite;transform-box:fill-box;transform-origin:center}.rotr{animation:rot 4s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.smoke{animation:smoke 4s infinite;transform-box:fill-box}.pk{animation:belt 6s linear infinite}.arm{animation:arm 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
.fl{animation:flow 2.4s linear infinite}.flt{animation:flt 3s ease-in-out infinite}.bob{animation:flt 2.5s ease-in-out infinite}
.sc{animation:scan 1.2s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0;transform:translateY(8px)}}@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}@keyframes grow{from{transform:scaleX(0)}}@keyframes growy{from{transform:scaleY(0)}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.7}100%{transform:translateY(-34px) scale(1.5);opacity:0}}
@keyframes belt{from{transform:translateX(-60px)}to{transform:translateX(330px)}}@keyframes arm{to{transform:rotate(-22deg)}}
@keyframes flow{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}@keyframes flt{50%{transform:translateY(-6px)}}@keyframes blink{50%{opacity:.2}}
@keyframes float{from{opacity:0;transform:translateY(20px)}}@keyframes scan{50%{opacity:.25;transform:scale(1.2)}}@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
.bv{transform-origin:bottom;animation:growy .9s ease-out both}.ln{stroke-dasharray:600;animation:draw 1.4s ease-out both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
@media(max-width:860px){aside{position:fixed;left:-260px;width:240px!important}aside.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}main{padding:12px}.menu{display:grid}.hero svg{display:none}.drop{right:0;width:calc(100vw - 24px)}aside.min .lb{display:inline!important}}

$('#app').innerHTML=`<aside class="${ST.sidemin?'min':''} ${ST.open?'open':''}"><div class="logo" style="color:var(--tx)"><span style="color:var(--or)">${ic('gear',30)}</span><span class="lb">KAARYA</span></div><div class="tag">Connected Manufacturing Intelligence</div>${NAV.map(([k,l,i])=>`<button class="nav ${base==k?'on':''}" data-go="${k}" title="${l}"><span style="color:var(--or)">${ic(i)}</span><span class="lb">${l}</span>${k=='approvals'&&pend?`<span class="pill w lb" style="margin-left:auto">${pend}</span>`:''}</button>`).join('')}<button class="nav" data-act="collapse" style="margin-top:14px"><span>${ic('menu')}</span><span class="lb">Collapse</span></button></aside><main><div class="top"><button class="ico menu" data-act="drawer" aria-label="Menu">${ic('menu')}</button><button class="search" data-go="assistant">${ic('search')}<span>Ask KAARYA anything…</span></button><button class="ico" data-act="notif" aria-label="Notifications">${ic('bell')}${pend?'<i class="dot"></i>':''}</button><div class="av" title="Factory Admin">F</div>${ST.notif?`<div class="card drop"><b>Notifications</b>${[['Furnace M-03 vibration is above normal','maintenance'],['2 new resource matches found','matcher'],[pend+' items await your approval','approvals']].map(n=>`<button class="nav" data-go="${n[1]}" style="font-size:13px">${ic('alert',16)}${n[0]}</button>`).join('')}</div>`:''}</div><div class="page" id="pg">${body}</div></main>`}
const back=(to,l)=>`<button class="btn ol sm" data-go="${to}" style="margin-bottom:12px">${ic('back',16)} ${l}</button>`;
const head=(t,s,r='')=>`<div class="row sp" style="margin-bottom:16px"><div><h1 style="font-size:32px">${t}</h1><div class="muted">${s}</div></div>${r}</div>`;
const stat=(l,v,s,c)=>`<div class="card"><div class="muted" style="font-size:13px">${l}</div><div class="big" style="color:${c||'inherit'}">${v}</div><div class="muted" style="font-size:12px">${s||''}</div></div>`;
// ---------- PAGES ----------
const P={};
P.home=()=>`<div class="hero"><div><div class="muted">Good morning! Here’s your factory overview.</div><h1>Your Factory, More Connected</h1><p>Monitor, coordinate and plan — with three AI agents that work together for a smoother factory.</p><button class="btn" style="margin-top:12px" data-go="assistant">${ic('spark',18)} Ask KAARYA anything</button></div>${factorySVG}</div>
<div class="grid g3">${[['maintenance','Predictive Maintenance','Keep your machines healthy and running longer.',gearSVG('#F28A36'),'linear-gradient(160deg,rgba(242,138,54,.2),transparent)',''],['operations','Factory Operations','Coordinate orders, materials and resources.',beltSVG(220),'linear-gradient(160deg,rgba(131,165,138,.28),transparent)','gr'],['finance','Financial Advisor','Understand costs and plan ahead with confidence.',coinSVG,'linear-gradient(160deg,rgba(102,134,180,.28),transparent)','bl']].map(a=>`<div class="card hv" data-go="${a[0]}" style="background:${a[4]},var(--card)"><h2>${a[1]}</h2><p class="muted">${a[2]}</p><div style="min-height:100px;display:grid;place-items:center">${a[3]}</div><button class="btn ${a[5]}" style="width:100%;justify-content:center">Explore Agent →</button></div>`).join('')}</div>
<h2 class="sec">Factory at a Glance</h2><div class="grid g4">${stat('Factory status','Running','All shifts normal','#4d7a56')}${stat('Machines online','24 / 26','92% availability')}${stat('Orders in progress','8','2 due tomorrow')}${stat('Resource matches','2 new','Steel scrap → cement')}${stat('Operational expenses','₹12.4 L','8% vs last month')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Daily Insights <span class="pill w">Simulated</span></h3>${[['Machine M-03 shows early signs of anomaly','machine-m03','alert'],['2 raw-material matches found','matcher','recycle'],['Production is 6% ahead of schedule','operations','check']].map(a=>`<button class="nav" data-go="${a[1]}">${ic(a[2])}${a[0]}</button>`).join('')}</div><div class="card"><h3>Recent Activity</h3>${[['10:42','Maintenance agent flagged vibration on M-03'],['10:15','Operations agent drafted update for Bharat Auto'],['09:50','Finance agent updated cash-flow estimate'],['09:20','Matcher found 2 potential by-product matches']].map(a=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)"><span class="pill b">${a[0]}</span>${a[1]}</div>`).join('')}</div></div>`;
P.overview=()=>head('Factory Overview','One page across all three agents')+`<div class="grid g4">${stat('Machines','26','2 need attention','#c25f12')}${stat('Open orders','8','5 listed below')}${stat('Pending approvals',AP.filter(a=>a.s=='p').length,'Owner action needed')}${stat('Monthly profit (est.)','₹13.6 L','Estimate')}</div><div class="card" style="margin-top:16px"><h3>Orders by deadline</h3><table>${O.map(o=>`<tr class="hv" data-go="order-${o.id}"><td><b>${o.id}</b></td><td>${o.c}</td><td>${o.due}</td><td><span class="pill ${o.st=='Pending'?'w':''}">${o.st}</span></td></tr>`).join('')}</table></div>`;
P.maintenance=()=>{const f=ST.fil,l=M.filter(m=>f=='all'||(f=='ok'?m.h>=85:m.h<85));return head('Predictive Maintenance','Simulated sensor data · anomaly flags are demo output',`<div>${gearSVG('#F28A36')}</div>`)+`<div class="grid g4">${stat('Total machines','26')}${stat('Operating normally','24','','#4d7a56')}${stat('Need attention','2','M-03, M-05','#c25f12')}${stat('Live vibration M-03','<span id="lv">'+ST.temps[9]+'</span>','°C furnace temp (simulated)')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Furnace M-03 temperature (live, simulated)</h3><div id="lc">${line(ST.temps,null)}</div></div><div class="card"><h3>Anomaly alerts</h3>${M.filter(m=>m.h<85).map(m=>`<button class="nav" data-go="machine-${m.id}" style="background:rgba(242,138,54,.1)">${ic('alert')}<span><b>${m.n}</b><br><small class="muted">Vibration ${m.vib} mm/s — above baseline</small></span></button>`).join('')}<div class="notice" style="margin-top:8px">Recommendation: inspect M-03 bearings this weekend.</div></div></div>
<div class="row" style="margin:20px 0 10px"><h2>Machines</h2>${[['all','All'],['ok','Healthy'],['bad','Attention']].map(a=>`<button class="btn sm ${f==a[0]?'':'ol'}" data-fil="${a[0]}">${a[1]}</button>`).join('')}</div><div class="grid g3">${l.map(m=>`<div class="card hv row" data-go="machine-${m.id}">${ring(m.h,hc(m.h))}<div><b>${m.n}</b><div class="muted" style="font-size:13px">${m.t} · ${m.loc}</div><span class="pill ${hp(m.h)[1]}">${hp(m.h)[0]}</span></div></div>`).join('')}</div>`};
P.machine=id=>{const m=M.find(x=>x.id==id)||M[2];const bad=m.h<85;return back('maintenance','Maintenance')+head(m.n,m.t+' · '+m.loc+' · Installed 2019')+`<div class="grid g3"><div class="card row">${ring(m.h,hc(m.h))}<div><b>Health score</b><div class="muted">${hp(m.h)[0]}</div></div></div>${stat('Temperature',m.temp+'°C','Normal range 55–75°C')}${stat('Vibration',m.vib+' mm/s','Baseline 2.4 mm/s',bad?'#c25f12':'')}</div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Detected anomalies</h3>${bad?`<p>• Vibration spikes at 14:10 and 16:40<br>• Temperature drifting +6°C over 3 days</p><span class="pill r">Risk: Medium-High (est. 18% failure chance in 30 days)</span>`:'<p>No anomalies detected in the last 30 days.</p><span class="pill">Risk: Low</span>'}</div><div class="card"><h3>Recommended maintenance</h3><p>${bad?'Inspect bearings and lubrication, then re-balance the rotor. Estimated downtime: 6 hours.':'Routine lubrication at next scheduled service.'}</p></div></div><div class="row" style="margin-top:16px">${[['analyse','Analyse Machine','spark',''],['plan','Generate Maintenance Plan','report','gr'],['tech','Find Technician','user','bl'],['parts','Find Spare Parts','box','nv'],['sched','Schedule Repair','wrench','']].map(a=>`<button class="btn ${a[3]}" data-mact="${a[0]}" data-id="${m.id}">${ic(a[2],18)}${a[1]}</button>`).join('')}</div>`};
P.operations=()=>{const q=ST.ofil.toLowerCase();const l=O.filter(o=>(o.c+o.p+o.id).toLowerCase().includes(q));return head('Business & Factory Operations','Orders, suppliers and materials')+`<div class="card" style="margin-bottom:16px"><h3>Production workflow</h3>${beltSVG(520)}<div class="row sp muted" style="font-size:12px"><span>Raw material</span><span>Machining</span><span>Quality check</span><span>Dispatch</span></div></div><div class="row"><h2>Orders</h2><input id="os" placeholder="Search orders…" value="${ST.ofil}" style="flex:1;max-width:280px"></div><div class="grid g3" style="margin-top:12px">${l.map(o=>`<div class="card hv" data-go="order-${o.id}"><div class="row sp"><b>${o.id}</b><span class="pill ${o.st=='Pending'?'w':''}">${o.st}</span></div><div>${o.c}</div><div class="muted" style="font-size:13px">${o.p}</div><div class="bar" style="margin:10px 0"><i style="width:${o.pr}%;background:var(--gr)"></i></div><div class="row sp muted" style="font-size:12px"><span>Due: ${o.due}</span><span>${o.v}</span></div></div>`).join('')||'<p class="muted">No orders match.</p>'}</div>
<div class="grid g2" style="margin-top:20px"><div class="card"><h3>Inventory</h3>${INV.map(a=>`<div style="margin:10px 0"><div class="row sp"><span>${a[0]}</span><span class="pill ${a[2]=='low'?'w':''}">${a[1]}%</span></div><div class="bar"><i style="width:${a[1]}%;background:${a[2]=='low'?'var(--or)':'var(--gr)'}"></i></div></div>`).join('')}<div class="notice">Procurement need: refractory lining (2 t), cartons (5,000).</div></div><div class="card"><h3>Suppliers</h3>${S.map((s,i)=>`<button class="nav" data-sup="${i}"><span style="color:var(--bl)">${ic('box')}</span><span><b>${s.n}</b><br><small class="muted">${s.m} · ★ ${s.r}</small></span></button>`).join('')}</div></div>`};
P.order=id=>{const o=O.find(x=>x.id==id)||O[0];return back('operations','Operations')+head(o.id+' — '+o.c,o.p)+`<div class="grid g3">${stat('Status',o.st)}${stat('Deadline',o.due)}${stat('Value',o.v)}</div><div class="card" style="margin-top:16px"><div class="row sp"><b>Progress</b><span>${o.pr}%</span></div><div class="bar"><i style="width:${o.pr}%;background:var(--gr)"></i></div></div><div class="row" style="margin-top:16px">${[['view','View Order'],['contact','Contact Customer'],['dead','Manage Deadline'],['sup','Find Supplier'],['res','Coordinate Resources']].map(a=>`<button class="btn ${a[0]=='view'?'nv':''}" data-oact="${a[0]}" data-id="${o.id}">${a[1]}</button>`).join('')}</div>`};
P.matcher=()=>`<div class="hero" style="background:linear-gradient(120deg,rgba(131,165,138,.3),rgba(242,138,54,.15))"><div style="flex:1"><h1>Circular Resource Matcher</h1><p>One factory’s by-product can be another factory’s raw material.</p><button class="btn" id="fm" style="margin-top:12px;font-size:17px;padding:14px 26px" data-act="find">${ST.scan?'<span class="spin"></span> Matching…':ic('recycle',20)+' Find New Matches'}</button></div><div style="flex:1;min-width:280px;max-width:500px">${mtSVG(ST.scan)}</div></div>
<div class="notice" style="margin-bottom:16px">${ic('shield',16)} Potential matches require independent quality, safety and regulatory verification before any material is exchanged.</div>
<div class="grid g2"><div class="card"><h3>Available by-products</h3>${['Steel mill scale — 42 t/mo','Foundry sand — 18 t/mo','Iron-rich slag — 60 t/mo'].map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--ln)">${x}</div>`).join('')}</div><div class="card"><h3>Factories searching</h3>${['Bagalkot Cements — iron-rich input','Rao Ferro Products — silica sand','Eco Bricks — fine aggregates'].map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--ln)">${x}</div>`).join('')}</div></div><h2 class="sec">Potential matches (${ST.matches.length})</h2><div class="grid g2">${ST.matches.map(m=>`<div class="card hv" data-go="match-${m.id}"><div class="row sp"><b>${m.mat}</b><span class="pill ${m.sc>85?'':'w'}">${m.sc}% fit</span></div><div class="muted">${m.f} → ${m.to}</div><div class="row sp muted" style="font-size:13px;margin-top:8px"><span>${ic('pin',14)} ${m.loc}</span><span>${m.q}</span></div><div class="bar" style="margin-top:8px"><i style="width:${m.sc}%;background:var(--gr)"></i></div></div>`).join('')}</div>`;
P.match=id=>{const m=MT.find(x=>x.id==id)||MT[0];return back('matcher','Resource Matcher')+head(m.mat+' match','Compatibility score is a simulated estimate')+`<div class="card">${mtSVG(false)}</div><div class="grid g3" style="margin-top:16px">${stat('Compatibility',m.sc+'%')}${stat('Quantity',m.q)}${stat('Distance',m.loc.split('·')[1])}</div><div class="card" style="margin-top:16px"><p><b>Supplier:</b> ${m.f}<br><b>Recipient:</b> ${m.to}<br><b>Route:</b> ${m.loc.split('·')[0]}</p><div class="notice">${ic('shield',16)} This is a potential match only. Independent quality, safety and regulatory verification is required.</div></div><div class="row" style="margin-top:16px"><button class="btn" data-mm="contact" data-id="${m.id}">Request Contact (needs approval)</button><button class="btn ol" data-mm="verify" data-id="${m.id}">Verification Checklist</button></div>`};
const fin=()=>{const s=ST.sc,v=1+s.vol/100,rev=48*v*(1+s.price/100),mat=22*v*(1+s.mat/100);return{rev,mat,pr:rev-mat-12.4}};
P.finance=()=>{const f=fin();const sc=ST.sc;return head('Financial Advisor','All figures are estimates and recommendations, not guaranteed outcomes',`<div>${coinSVG}</div>`)+`<div class="grid g4">${stat('Revenue (month)','₹48.0 L','Estimate')}${stat('Operating expenses','₹12.4 L','↑ 8% (est.)','#c25f12')}${stat('Production costs','₹22.0 L','Estimate')}${stat('Net cash flow','₹13.6 L','Estimate','#4d7a56')}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Monthly revenue (₹ L)</h3>${line([38,41,40,44,46,48],['Jun','Jul','Aug','Sep','Oct','Nov'],'#6686B4')}</div><div class="card"><h3>Expense breakdown (₹ L)</h3>${bars([22,8,4.4,3],['Material','Labour','Utility','Other'])}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>AI recommendations <span class="pill b">Estimate</span></h3>${['Production expenses increased by 8%.','Consider reviewing raw-material procurement costs.','Cash-flow projection indicates a potential shortfall next month.'].map(x=>`<div class="notice" style="margin:8px 0">${x}</div>`).join('')}<div class="row" style="margin-top:10px">${[['exp','Analyse Expenses'],['bud','Generate Budget'],['cash','View Cash Flow'],['ask','Ask Financial Advisor']].map(a=>`<button class="btn sm ${a[0]=='ask'?'bl':'ol'}" data-fact="${a[0]}">${a[1]}</button>`).join('')}</div></div><div class="card" id="scn"><h3>Compare scenarios</h3>${[['mat','Raw-material price',-10,20],['vol','Order volume',-20,30],['price','Selling price',-5,10]].map(a=>`<label class="muted" style="font-size:13px">${a[1]}: <b id="v-${a[0]}">${sc[a[0]]>0?'+':''}${sc[a[0]]}%</b></label><input type="range" min="${a[2]}" max="${a[3]}" value="${sc[a[0]]}" data-sl="${a[0]}">`).join('')}<div class="row sp" style="margin-top:10px"><div><div class="muted" style="font-size:12px">Projected profit (est.)</div><div class="big" id="pp" style="color:${f.pr>=13.6?'#4d7a56':'#c25f12'}">${LAK(f.pr)}</div></div><button class="btn ol sm" data-fact="reset">Reset</button></div><small class="muted">Baseline ₹13.6 L. Simulated estimate, not a guarantee.</small></div></div>`};
const AG={Maintenance:['wrench','#F28A36'],Operations:['box','#83A58A'],Financial:['coin','#6686B4']};
const reply=q=>{q=q.toLowerCase();if(/machine|maint|attention|plan|furnace/.test(q))return['Maintenance','Induction Furnace M-03 needs attention: vibration is 5.6 mm/s against a 2.4 baseline. I suggest a bearing inspection this Saturday (est. ₹38,000). I can prepare it for your approval.'];if(/order|due|customer|supplier/.test(q))return['Operations','Two orders are due tomorrow: SO-1042 (Bharat Auto Parts, 72% done) and SO-1045 (Deccan Fabricators, 88% done). Both look on track.'];if(/steel|scrap|factor|match|material/.test(q))return['Operations','I found 2 potential matches for steel mill scale. Best: Bagalkot Cements (94% fit, 190 km). Quality and regulatory checks are required first.'];if(/cost|money|cash|expense|budget|profit/.test(q))return['Financial','Estimated production cost this month is ₹22.0 L, with operating expenses at ₹12.4 L (up about 8%). This is an estimate, not an accounting figure.'];return['Operations','I can help with machines, orders, materials and finances. Try one of the suggested prompts.']};
P.assistant=()=>head('KAARYA Assistant','Simulated conversations · no real AI is connected in this prototype')+`<div class="row" style="margin-bottom:10px">${Object.entries(AG).map(([k,v])=>`<span class="pill" style="background:${v[1]}33">${ic(v[0],14)} ${k} Assistant</span>`).join('')}</div><div class="card" style="padding:14px"><div id="chat" style="height:46vh;overflow:auto">${ST.chat.map(chatMsg).join('')}</div><div class="row" style="margin:10px 0">${['Which machine needs attention?','What orders are due tomorrow?','Find factories that need steel scraps','How much did production cost this month?','Prepare a maintenance plan'].map(p=>`<button class="btn ol sm" data-prompt="${p}">${p}</button>`).join('')}</div><div class="row"><input id="ci" placeholder="Ask in plain language…" style="flex:1"><button class="btn" data-act="send">${ic('send',18)} Send</button></div></div>`;
const chatMsg=m=>m.u?`<div class="msg u">${m.t}</div>`:`<div class="msg a"><small class="muted">${m.a?m.a+(m.a=='KAARYA'?'':' Assistant'):''}</small><br>${m.t}</div>`;
P.approvals=()=>head('Approval Centre','KAARYA recommends — you decide. Actions here are simulated.')+`<div class="grid g2">${AP.map(a=>`<div class="card"><div class="row sp"><b>${a.t}</b><span class="pill ${a.s=='p'?'w':a.s=='a'?'':'r'}">${a.s=='p'?'Pending':a.s=='a'?'Approved (simulated)':'Rejected'}</span></div><p style="margin:8px 0"><b>Recommendation:</b> ${a.rec}<br><b>Reason:</b> ${a.why}<br><b>Est. cost:</b> ${a.cost} · <b>Agent:</b> ${a.ag}</p>${a.s=='p'?`<div class="row"><button class="btn gr sm" data-ap="a" data-id="${a.id}">Approve</button><button class="btn ol sm" data-ap="r" data-id="${a.id}">Reject</button><button class="btn ol sm" data-ap="d" data-id="${a.id}">Review Details</button></div>`:'<small class="muted">Recorded in this demo only — no external action was taken.</small>'}</div>`).join('')}</div>`;
P.reports=()=>head('Reports','Simulated summaries')+`<div class="grid g3">${[['Weekly maintenance summary','2 machines flagged, 1 repair pending approval.'],['Order fulfilment report','8 open orders; 2 due tomorrow; 6% ahead of schedule.'],['Monthly financial estimate','Revenue ₹48.0 L, expenses ₹34.4 L, est. net ₹13.6 L.']].map(r=>`<div class="card hv" data-rep="${r[1]}" data-t="${r[0]}"><h3>${r[0]}</h3><p class="muted">Click to generate preview</p></div>`).join('')}</div>`;
P.settings=()=>head('Settings','Preferences are stored for this session only')+`<div class="card">${[['Notifications','Alerts for anomalies and approvals'],['Require owner approval for external actions','Always on in this prototype'],['Use Indian rupee format','₹ lakh display']].map((s,i)=>`<label class="row sp" style="padding:10px 0;border-bottom:1px solid var(--ln)"><span><b>${s[0]}</b><br><small class="muted">${s[1]}</small></span><input type="checkbox" checked ${i==1?'disabled':''}></label>`).join('')}</div>`;
// ---------- ROUTER ----------
function render(){const h=location.hash.slice(1)||'home';let p,k=h;if(h.startsWith('machine-'))p=P.machine(h.slice(8));else if(h.startsWith('order-'))p=P.order(h.slice(6));else if(h.startsWith('match-'))p=P.match(h.slice(6));else p=(P[h]||P.home)();shell(h,p);window.scrollTo(0,0)}
addEventListener('hashchange',()=>{ST.notif=false;ST.open=false;render()});
function typeReply(q){ST.chat.push({u:1,t:q});const c=$('#chat');ST.chat.push({a:'…',t:'<span class="typing"><i></i><i></i><i></i></span>',tmp:1});if(c){c.innerHTML=ST.chat.map(chatMsg).join('');c.scrollTop=1e5}setTimeout(()=>{ST.chat=ST.chat.filter(m=>!m.tmp);const r=reply(q);ST.chat.push({a:r[0],t:r[1]});if(location.hash=='#assistant'){const c=$('#chat');c.innerHTML=ST.chat.map(chatMsg).join('');c.scrollTop=1e5}},1100)}
const MA={analyse:(m)=>{modal(`<h2>Analysing ${m.n}…</h2><p><span class="spin"></span> Reading simulated sensor history</p>`);setTimeout(()=>modal(`<h2>Analysis report — ${m.n}</h2><p>Health ${m.h}/100. ${m.h<85?'Anomaly score 0.71 (above the 0.55 alert level). Pattern consistent with bearing wear.':'No anomalies; scores are within expected range.'}</p>${SIM}`),1500)},plan:m=>modal(`<h2>Maintenance plan — ${m.n}</h2><p>1. Stop the machine at the next shift change<br>2. Inspect bearings and lubrication<br>3. Replace worn parts if needed<br>4. Re-test vibration for 2 hours<br><b>Est. downtime:</b> 6 h</p>${SIM}`),tech:m=>modal(`<h2>Nearby technicians</h2>${[['Ravi Kumar Services','4.7 · 12 km · available Sat'],['Precision Motors','4.5 · 20 km · available Mon'],['SK Industrial Care','4.3 · 9 km · available Sun']].map(t=>`<div class="card" style="margin:8px 0;padding:12px"><b>${t[0]}</b><br><small class="muted">${t[1]}</small></div>`).join('')}${SIM}`),parts:m=>modal(`<h2>Spare parts</h2>${[['Bearing set 6310','₹4,200','In stock · Peenya'],['Lubrication kit','₹1,150','In stock · Tumakuru'],['Vibration damper','₹6,800','3-day delivery']].map(t=>`<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--ln)"><span>${t[0]}<br><small class="muted">${t[2]}</small></span><b>${t[1]}</b></div>`).join('')}${SIM}`),sched:m=>{let a=AP.find(x=>x.id==1);if(a.s!='p'&&!AP.find(x=>x.id==99))AP.unshift({id:99,t:'Schedule repair — '+m.n,ag:'Maintenance',rec:'Repair visit Sat 9 AM.',why:'Health score '+m.h+'.',cost:'₹38,000',s:'p'});modal(`<h2>Owner approval needed</h2><p>Proposed: repair visit for <b>${m.n}</b>, Saturday 9 AM, est. ₹38,000.</p><div class="row"><button class="btn gr" data-ap2="a">Approve</button><button class="btn ol" data-ap2="r">Reject</button></div>${SIM}`)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act],[data-fil],[data-mact],[data-oact],[data-sup],[data-mm],[data-fact],[data-prompt],[data-ap],[data-ap2],[data-rep]');if(!t){if(ST.notif){ST.notif=false;render()}return}const d=t.dataset;
if(d.go){location.hash=d.go;if(location.hash=='#'+d.go&&!ST.notif&&!ST.open)render();return}
if(d.act=='close'){$('#layer').innerHTML='';return}
if(d.act=='collapse'){ST.sidemin=!ST.sidemin;return render()}if(d.act=='drawer'){ST.open=!ST.open;return render()}if(d.act=='notif'){e.stopPropagation();ST.notif=!ST.notif;return render()}
if(d.fil){ST.fil=d.fil;return render()}
if(d.mact){return MA[d.mact](M.find(x=>x.id==d.id))}
if(d.oact){const o=O.find(x=>x.id==d.id),k=d.oact;const T={view:`<h2>${o.id}</h2><p>${o.c}<br>${o.p}<br>Value ${o.v} · Due ${o.due}</p>`,contact:`<h2>Draft message to ${o.c}</h2><p>“Hello, your order ${o.id} is progressing well and is on track for ${o.due}.”</p><button class="btn" data-ap2="x">Queue for approval</button>`,dead:`<h2>Manage deadline</h2><p>Current: ${o.due}. KAARYA suggests keeping the date; buffer is about 1 day.</p>`,sup:`<h2>Suggested suppliers</h2><p>${S.slice(0,2).map(s=>s.n+' — '+s.lt).join('<br>')}</p>`,res:`<h2>Resource coordination</h2><p>Furnace M-03 is flagged; shift this order to M-01/M-02 to reduce risk.</p>`};return modal(T[k]+SIM)}
if(d.sup){const s=S[d.sup];return modal(`<h2>${s.n}</h2><p>Supplies: ${s.m}<br>Location: ${s.d}<br>Rating ★ ${s.r} · Lead time ${s.lt}</p><button class="btn" data-ap2="x">Request quote (needs approval)</button>${SIM}`)}
if(d.ap2){if(d.ap2=='x'){AP.unshift({id:Date.now(),t:'Supplier / customer contact request',ag:'Operations',rec:'Contact request queued from a detail page.',why:'Raised by you.',cost:'—',s:'p'});$('#layer').innerHTML='';toast('Added to Approval Centre (simulated)');return render()}
const a=AP.find(x=>x.id==99)||AP.find(x=>x.id==1);a.s=d.ap2;$('#layer').innerHTML='';toast(d.ap2=='a'?'Approved — recorded in demo only':'Rejected');return render()}
if(d.mm){const m=MT.find(x=>x.id==d.id);if(d.mm=='contact'){AP.unshift({id:Date.now(),t:'Confirm resource match — '+m.mat,ag:'Operations',rec:'Contact '+m.to+'.',why:m.sc+'% fit.',cost:'—',s:'p'});toast('Added to Approval Centre');return render()}return modal(`<h2>Verification checklist</h2><p>☐ Lab analysis of material<br>☐ Safety data sheet reviewed<br>☐ Environmental / pollution board rules checked<br>☐ Transport and handling permits<br>☐ Written agreement</p>`)}
if(d.act=='find'){if(ST.scan)return;ST.scan=1;render();setTimeout(()=>{ST.scan=0;ST.matches=MT.slice(0,4);render();toast('Simulated search complete: 4 potential matches')},2200);return}
if(d.fact){const F={exp:'<h2>Expense analysis</h2><p>Material costs are 64% of spend and rose about 5% (est.). Consider renegotiating with 2 suppliers.</p>',bud:'<h2>Suggested budget (estimate)</h2><p>Materials ₹21.5 L · Labour ₹8 L · Utilities ₹4 L · Buffer ₹2 L</p>',cash:'<h2>Cash-flow outlook</h2><p>Next month: est. shortfall of ₹1.8 L around day 20 if the pig iron purchase proceeds as planned.</p>'};if(d.fact=='reset'){ST.sc={mat:0,vol:0,price:0};return render()}if(d.fact=='ask'){typeReply('How much did production cost this month?');return location.hash='assistant'}return modal(F[d.fact]+'<p class="muted">Estimates only, not guaranteed outcomes.</p>')}
if(d.prompt){return typeReply(d.prompt)}
if(d.act=='send'){const i=$('#ci');if(i.value.trim()){typeReply(i.value.trim());i.value=''}return}
if(d.ap){const a=AP.find(x=>x.id==d.id);if(d.ap=='d')return modal(`<h2>${a.t}</h2><p>${a.rec}<br>${a.why}<br>Cost: ${a.cost} · Agent: ${a.ag}</p>${SIM}`);a.s=d.ap;toast(d.ap=='a'?'Approved — recorded in demo only':'Rejected');return render()}
if(d.rep){modal(`<h2>${t.dataset.t}</h2><p>${d.rep}</p>${SIM}`)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='os'){ST.ofil=t.value;const p=$('#pg');const pos=t.selectionStart;render();const n=$('#os');n.focus();n.setSelectionRange(pos,pos)}if(t.dataset.sl){ST.sc[t.dataset.sl]=+t.value;const f=fin();$('#v-'+t.dataset.sl).textContent=(t.value>0?'+':'')+t.value+'%';const p=$('#pp');p.textContent=LAK(f.pr);p.style.color=f.pr>=13.6?'#4d7a56':'#c25f12'}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#layer').innerHTML='';if(e.key=='Enter'&&e.target.id=='ci')$('[data-act=send]').click();if((e.metaKey||e.ctrlKey)&&e.key=='k'){e.preventDefault();location.hash='assistant'}});
setInterval(()=>{const l=ST.temps;l.push(Math.max(84,Math.min(98,l[l.length-1]+Math.round((Math.random()-.45)*3))));l.shift();const c=$('#lc');if(c&&location.hash=='#maintenance'){c.innerHTML=line(l,null).replace('class="ln"','');$('#lv').textContent=l[l.length-1]}},2000);
render();
</script></body></html>
